databases:
  - name: trocville-soukabritz-db
    databaseName: trocville
    plan: free

services:
  - type: web
    name: trocville-soukabritz-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trocville-soukabritz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: MIGRATE_ON_START
        value: "true"
      - key: CLIENT_ORIGIN
        value: https://trocville-soukabritz.onrender.com
      - key: GOOGLE_CLIENT_IDS
        value: 940470178084-q67n7nev77582920ggtf854rimtp03ai.apps.googleusercontent.com,940470178084-qg6o7joeand6iovm050cabat4pt5dfvj.apps.googleusercontent.com

  - type: web
    name: trocville-soukabritz
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: EXPO_PUBLIC_API_URL
        value: https://trocville-soukabritz-api.onrender.com/api
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        value: 940470178084-q67n7nev77582920ggtf854rimtp03ai.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
        value: 940470178084-qg6o7joeand6iovm050cabat4pt5dfvj.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
